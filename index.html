<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OdontoApp</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sb:#0f172a;--sb2:#1e293b;--sb3:#334155;--sbtext:#cbd5e1;--sbactive:#38bdf8;
  --accent:#0ea5e9;--accent2:#0284c7;--green:#10b981;--red:#ef4444;--amber:#f59e0b;--purple:#8b5cf6;
  --bg:#f1f5f9;--card:#fff;--border:#e2e8f0;--text:#0f172a;--text2:#64748b;--text3:#94a3b8;
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
.app{display:flex;height:100vh}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}

/* ── SIDEBAR ── */
.sb{width:230px;min-width:230px;background:var(--sb);display:flex;flex-direction:column}
.sb-logo{padding:16px 14px 12px;border-bottom:1px solid var(--sb3);display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .15s}
.sb-logo:hover{background:var(--sb2)}
.sb-logo-img{width:38px;height:38px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;transition:background .3s}
.sb-logo-img img{width:100%;height:100%;object-fit:cover}
.sb-logo-img svg{width:22px;height:22px}
.sb-logo-name{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.3px;transition:color .3s}
.sb-logo-prof{font-size:9px;color:var(--sbtext);margin-top:1px;opacity:.8}
.sb-nav{padding:8px 0}
.sb-section{padding:10px 16px 4px;font-size:9px;font-weight:700;color:var(--sbtext);letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer;border-left:3px solid transparent;color:var(--sbtext);transition:all .15s;margin:1px 0}
.sb-item:hover{background:var(--sb2);color:#fff}
.sb-item.active{background:rgba(56,189,248,.12);border-left-color:var(--sbactive);color:var(--sbactive)}
.sb-item svg{width:17px;height:17px;flex-shrink:0;stroke:currentColor}
.sb-item span{font-size:13px;font-weight:500}
.sb-divider{border-top:1px solid var(--sb3);margin:4px 0}
.sb-bottom{border-top:1px solid var(--sb3);display:flex;flex-direction:column;flex:1;min-height:0}
.sb-pts-hdr{padding:10px 14px 4px;font-size:9px;font-weight:700;color:var(--sbtext);letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.sb-search{padding:0 10px 6px}
.sb-search input{width:100%;padding:6px 10px;background:var(--sb2);border:1px solid var(--sb3);border-radius:7px;font-size:12px;color:#e2e8f0;outline:none}
.sb-search input::placeholder{color:#64748b}
.sb-pt-list{overflow-y:auto;flex:1;padding:0 8px}
.sb-pt{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;transition:background .15s;margin-bottom:2px}
.sb-pt:hover{background:var(--sb2)}
.sb-pt.active{background:rgba(56,189,248,.15)}
.sb-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.sb-pt-name{font-size:12px;font-weight:500;color:#e2e8f0}
.sb-pt-meta{font-size:10px;color:#64748b}
.sb-add{margin:8px 10px 12px;padding:8px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:background .15s}
.sb-add:hover{background:var(--accent2)}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:56px;padding:0 22px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.tb-title{font-size:16px;font-weight:700;color:var(--text)}
.tb-badge{font-size:11px;color:var(--text2);background:var(--bg);padding:3px 10px;border-radius:20px;margin-left:8px}
.tb-right{display:flex;gap:8px}
.btn-sm{padding:7px 14px;border:1px solid var(--border);border-radius:8px;font-size:12px;cursor:pointer;background:var(--card);color:var(--text2);transition:all .15s;font-family:inherit}
.btn-sm:hover{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;padding:0 22px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.tab{padding:13px 16px;font-size:12px;font-weight:500;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab:hover{color:var(--text)}
.content{flex:1;overflow-y:auto;padding:20px 22px;background:var(--bg)}

/* ── CARDS / LAYOUT ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px}
.card-title{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.fl{font-size:11px;color:var(--text3);margin-bottom:3px}
.fv{font-size:14px;font-weight:500;color:var(--text)}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.kpi-label{font-size:11px;color:var(--text2);margin-bottom:6px}
.kpi-val{font-size:26px;font-weight:700;color:var(--text);line-height:1}
.kpi-sub{font-size:10px;color:var(--text3);margin-top:4px}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:#d1fae5;color:#065f46}
.badge-amber{background:#fef3c7;color:#92400e}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-blue{background:#dbeafe;color:#1e40af}
.row-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.row-item:last-child{border:none}
.row-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.row-name{font-size:13px;font-weight:500;color:var(--text)}
.row-meta{font-size:11px;color:var(--text3)}
.row-price{font-size:14px;font-weight:700;color:var(--text);margin-left:auto}
.pay-amount{font-size:15px;font-weight:700;color:var(--green)}
.pay-egreso{font-size:15px;font-weight:700;color:var(--red)}
.total-bar{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:#dbeafe;border-radius:10px;margin-top:12px}
.total-bar.debt{background:#fee2e2}.total-bar.neg{background:#fee2e2}
.total-lbl{font-size:13px;font-weight:600;color:#1e40af}
.total-lbl.debt,.total-lbl.neg{color:#991b1b}
.total-val{font-size:18px;font-weight:700;color:#1e40af}
.total-val.debt,.total-val.neg{color:#991b1b}
.appt-date-box{width:44px;text-align:center;background:var(--bg);border-radius:10px;padding:6px 4px;flex-shrink:0}
.appt-day{font-size:20px;font-weight:700;color:var(--text);line-height:1}
.appt-mon{font-size:10px;color:var(--text3);margin-top:1px}
.diary-item{padding:12px 0;border-bottom:1px solid var(--border)}
.diary-item:last-child{border:none}
.diary-date{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.diary-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.diary-body{font-size:12px;color:var(--text2);line-height:1.6}
.diary-alert{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:11px;color:#92400e;background:#fef3c7;padding:3px 10px;border-radius:20px}
.chart-bar-wrap{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:10px}
.chart-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.chart-bar{width:100%;border-radius:4px 4px 0 0;min-height:3px}
.chart-lbl{font-size:8px;color:var(--text3)}
.dash-greeting{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px}
.dash-sub{font-size:13px;color:var(--text2);margin-bottom:20px}
.today-appt{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.today-appt:last-child{border:none}
.time-badge{background:var(--accent);color:#fff;padding:4px 10px;border-radius:7px;font-size:11px;font-weight:700;min-width:56px;text-align:center;flex-shrink:0}
.bday-card{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #fcd34d;border-radius:12px;padding:14px;margin-bottom:14px}
.odo-sec-lbl{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--text2);text-align:center;margin-bottom:8px;text-transform:uppercase}
.odo-sec-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 8px;margin-bottom:12px;overflow-x:auto}
.teeth-row{display:flex;justify-content:center;gap:5px}
.tooth-col{display:flex;flex-direction:column;align-items:center;gap:2px}
.tooth-num{font-size:10px;font-weight:600;color:#4338ca}
.apply-lbl{font-size:7px;color:var(--text3)}
.odo-legend{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
.odo-legend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:7px}
.leg-item{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text2)}

/* TOOTH POPUP */
.tooth-popup{position:fixed;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;z-index:9999;width:215px;box-shadow:0 12px 40px rgba(0,0,0,.18);display:none;max-height:82vh;overflow-y:auto}
.tooth-popup.show{display:block}
.tp-title{font-size:11px;font-weight:700;color:var(--text);margin-bottom:7px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.tp-opt{padding:5px 7px;font-size:11px;cursor:pointer;border-radius:8px;color:var(--text);display:flex;align-items:center;gap:7px}
.tp-opt:hover{background:var(--bg)}.tp-opt.active{background:#dbeafe;color:#1e40af}
.tp-section{font-size:9px;color:var(--text3);font-weight:700;padding:5px 0 3px;border-top:1px solid var(--border);margin-top:3px;text-transform:uppercase}
.tp-section:first-child{border:none;padding-top:0}
.tp-clear{width:100%;margin-top:6px;padding:6px;font-size:11px;cursor:pointer;border-radius:8px;color:var(--text2);background:var(--bg);border:1px solid var(--border);text-align:center}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:300;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:18px;padding:26px;width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 70px rgba(0,0,0,.25)}
.modal-lg{width:700px}
.modal-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:18px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-full{grid-template-columns:1fr}
.form-group label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:600}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:9px;font-size:13px;color:var(--text);outline:none;background:#f8fafc;transition:border .15s;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);background:var(--card)}
.form-group textarea{resize:vertical;min-height:72px}
.modal-footer{display:flex;gap:9px;justify-content:flex-end;margin-top:20px;padding-top:14px;border-top:1px solid var(--border)}
.btn-primary{padding:9px 22px;background:var(--accent);color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;font-family:inherit}
.btn-primary:hover{background:var(--accent2)}
.btn-danger{background:var(--red)!important}.btn-danger:hover{background:#dc2626!important}
.btn-sec{padding:9px 18px;background:var(--card);color:var(--text2);border:1px solid var(--border);border-radius:9px;font-size:13px;cursor:pointer;font-family:inherit}
.btn-sec:hover{background:var(--bg)}
.color-swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.cs{width:30px;height:30px;border-radius:8px;cursor:pointer;border:3px solid transparent;transition:transform .1s}
.cs:hover{transform:scale(1.1)}.cs.sel{border-color:#0f172a}
.action-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.del-btn{padding:5px 11px;font-size:11px;background:var(--bg);color:var(--text2);border:1px solid var(--border);border-radius:7px;cursor:pointer}
.del-btn:hover{background:#fee2e2;color:var(--red);border-color:#fca5a5}
.done-btn{padding:5px 11px;font-size:11px;background:#d1fae5;color:#065f46;border:none;border-radius:7px;cursor:pointer;font-weight:600}
.done-btn:hover{background:#a7f3d0}
.comp-btn{padding:5px 11px;font-size:11px;background:#dbeafe;color:#1e40af;border:none;border-radius:7px;cursor:pointer;font-weight:600;margin-left:auto}

/* FACTURA */
.fact-preview{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;font-size:12px;color:var(--text)}
.fact-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--text)}
.fact-logo-area{display:flex;align-items:center;gap:10px}
.fact-company{font-size:14px;font-weight:700;color:var(--text)}
.fact-ruc{font-size:11px;color:var(--text2)}
.fact-title-box{background:var(--text);color:#fff;padding:8px 16px;border-radius:6px;text-align:center}
.fact-title-box .ft{font-size:11px;font-weight:700;letter-spacing:.05em}
.fact-title-box .fn{font-size:18px;font-weight:700}
.fact-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.fact-info-block{border:0.5px solid var(--border);border-radius:6px;padding:8px}
.fact-info-label{font-size:9px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.fact-info-val{font-size:12px;color:var(--text);font-weight:500}
.fact-table{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:11px}
.fact-table th{background:var(--bg);padding:7px 10px;text-align:left;font-weight:700;color:var(--text2);font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.fact-table td{padding:7px 10px;border-bottom:0.5px solid var(--border)}
.fact-table tr:last-child td{border:none}
.fact-totals{display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin-bottom:14px}
.fact-total-row{display:flex;gap:20px;font-size:12px}
.fact-total-row.final{font-size:14px;font-weight:700;border-top:1px solid var(--text);padding-top:6px;margin-top:3px}
.fact-footer{text-align:center;font-size:10px;color:var(--text3);border-top:1px solid var(--border);padding-top:10px}
.fact-autorizacion{background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:8px 12px;margin-bottom:12px}
.fact-auth-label{font-size:9px;font-weight:700;color:#15803d;text-transform:uppercase;letter-spacing:.04em}
.fact-auth-num{font-size:12px;font-weight:700;color:#166534;font-family:monospace;letter-spacing:.05em}

/* RECETA MSP */
.receta-preview{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;color:#0f172a;font-size:11px;font-family:'Times New Roman',serif}
.receta-header{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px;padding-bottom:10px;border-bottom:3px solid #1e3a5f}
.receta-logo-box{width:70px;height:70px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid #e2e8f0;border-radius:6px;overflow:hidden}
.receta-logo-box img{width:100%;height:100%;object-fit:contain}
.receta-clinica{flex:1}
.receta-clinica-name{font-size:14px;font-weight:700;color:#1e3a5f;text-transform:uppercase;letter-spacing:.05em}
.receta-clinica-sub{font-size:10px;color:#64748b;margin-top:2px}
.receta-num-box{text-align:right;border:1px solid #1e3a5f;padding:6px 12px;border-radius:6px}
.receta-num-label{font-size:9px;font-weight:700;color:#1e3a5f;text-transform:uppercase;letter-spacing:.06em}
.receta-num-val{font-size:16px;font-weight:700;color:#1e3a5f;font-family:'Courier New',monospace}
.receta-info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;padding:10px;background:#f8fafc;border-radius:8px;border:1px solid #e2e8f0}
.receta-field-label{font-size:8px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.receta-field-val{font-size:11px;font-weight:600;color:#0f172a;border-bottom:1px solid #e2e8f0;padding-bottom:2px}
.receta-rp{font-size:13px;font-weight:700;color:#1e3a5f;margin-bottom:8px;letter-spacing:.05em}
.receta-med-row{display:flex;gap:8px;padding:8px 0;border-bottom:1px dashed #e2e8f0;align-items:flex-start}
.receta-med-row:last-child{border:none}
.receta-med-num{width:20px;height:20px;border-radius:50%;background:#1e3a5f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px}
.receta-med-name{font-size:12px;font-weight:700;color:#0f172a}
.receta-med-detail{font-size:10px;color:#64748b;margin-top:2px}
.receta-footer{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px;padding-top:12px;border-top:1px solid #e2e8f0}
.receta-sign-box{text-align:center}
.receta-sign-line{border-top:1px solid #0f172a;margin-bottom:5px}
.receta-sign-label{font-size:9px;color:#64748b}
.receta-msp-note{text-align:center;margin-top:10px;font-size:9px;color:#94a3b8;font-style:italic;padding-top:8px;border-top:1px solid #e2e8f0}
.receta-stamp{display:inline-flex;align-items:center;gap:5px;background:#dbeafe;border:1px solid #93c5fd;border-radius:20px;padding:4px 12px;font-size:10px;font-weight:700;color:#1e40af;margin-top:8px}
/* Upload area */
.upload-area{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;cursor:pointer;transition:border-color .15s}
.upload-area:hover{border-color:var(--accent)}
.upload-area input[type=file]{display:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">

<!-- ═══ SIDEBAR ═══ -->
<div class="sb">
  <div class="sb-logo" onclick="openLogoEdit()">
    <div class="sb-logo-img" id="logoIcon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round">
        <path d="M12 2C9.2 2 7 4.2 7 7c0 2 1 4 2.2 5.2L10.5 21c.2.8.8 1 1.5 1s1.3-.2 1.5-1l1.3-8.8C16 11 17 9 17 7c0-2.8-2.2-5-5-5z"/>
      </svg>
    </div>
    <div style="min-width:0">
      <div class="sb-logo-name" id="logoText">OdontoApp</div>
      <div class="sb-logo-prof" id="logoProfesional">Dr. Profesional</div>
    </div>
  </div>

  <div class="sb-nav">
    <div class="sb-section">General</div>
    <div class="sb-item active" id="nav-dashboard" onclick="showPage('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Dashboard</span>
    </div>
    <div class="sb-item" id="nav-agenda" onclick="showPage('agenda')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Agenda</span>
    </div>
    <div class="sb-item" id="nav-estadisticas" onclick="showPage('estadisticas')">

<script>
// ═══ ODONTOGRAMA ═══
const ODO_S=50,ODO_M=3,ODO_ZONES=['top','right','bottom','left','center'];
const ZONE_NAMES={top:'Vestibular',right:'Distal',bottom:'Palatino/Lingual',left:'Mesial',center:'Oclusal'};
const ODO_GROUPS=[
  {label:'Permanente Superior',teeth:[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28]},
  {label:'Temporal Superior',teeth:[55,54,53,52,51,61,62,63,64,65]},
  {label:'Temporal Inferior',teeth:[85,84,83,82,81,71,72,73,74,75]},
  {label:'Permanente Inferior',teeth:[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38]},
];
const ODO_SURF=[{id:'caries',label:'Caries',col:'#E24B4A'},{id:'obturado',label:'Obturado',col:'#185FA5'}];
const ODO_WHOLE=[
  {id:'extraccion',label:'Extracción indicada'},{id:'perd_caries',label:'Pérdida por caries'},
  {id:'perd_otra',label:'Pérdida (otra causa)'},{id:'endo_hacer',label:'Endodoncia por realizar'},
  {id:'endo_hecha',label:'Endodoncia realizada'},{id:'corona_r',label:'Corona por realizar'},
  {id:'corona_h',label:'Corona realizada'},{id:'prot_fija',label:'Prótesis fija'},
  {id:'prot_rem',label:'Prótesis removible'},{id:'prot_tot_r',label:'Prótesis total (por realizar)'},
  {id:'prot_tot_b',label:'Prótesis total (realizada)'},{id:'sell_nec',label:'Sellante necesario'},
  {id:'sell_real',label:'Sellante realizado'},
];

function odoZP(z,s){
  const m=ODO_M,t=s-m,c=s/2;
  if(z==='top') return`M${m},${m}L${t},${m}L${c},${c}Z`;
  if(z==='right') return`M${t},${m}L${t},${t}L${c},${c}Z`;
  if(z==='bottom') return`M${t},${t}L${m},${t}L${c},${c}Z`;
  if(z==='left') return`M${m},${t}L${m},${m}L${c},${c}Z`;
  return`M${c-10},${c-10}L${c+10},${c-10}L${c+10},${c+10}L${c-10},${c+10}Z`;
}

function drawWS(id,s){
  const m=4,t=s-m,c=s/2,R='#E24B4A',B='#185FA5';
  const cross=(col)=>`<line x1="${m}" y1="${m}" x2="${t}" y2="${t}" stroke="${col}" stroke-width="2.8" stroke-linecap="round"/><line x1="${t}" y1="${m}" x2="${m}" y2="${t}" stroke="${col}" stroke-width="2.8" stroke-linecap="round"/>`;
  switch(id){
    case'extraccion':return cross(R);
    case'perd_caries':return cross(B);
    case'perd_otra':return`<circle cx="${c}" cy="${c}" r="${c-4}" fill="none" stroke="${R}" stroke-width="2.2"/><line x1="${c-9}" y1="${c-9}" x2="${c+9}" y2="${c+9}" stroke="${R}" stroke-width="2.2" stroke-linecap="round"/><line x1="${c+9}" y1="${c-9}" x2="${c-9}" y2="${c+9}" stroke="${R}" stroke-width="2.2" stroke-linecap="round"/>`;
    case'endo_hacer':return`<polygon points="${c},${m+2} ${t-1},${t-1} ${m+1},${t-1}" fill="none" stroke="${R}" stroke-width="2"/>`;
    case'endo_hecha':return`<polygon points="${c},${m+2} ${t-1},${t-1} ${m+1},${t-1}" fill="none" stroke="${B}" stroke-width="2"/>`;
    case'corona_r':return`<rect x="${m+1}" y="${m+1}" width="${s-m*2-2}" height="${s-m*2-2}" rx="1" fill="none" stroke="${R}" stroke-width="2.5"/>`;
    case'corona_h':return`<rect x="${m+1}" y="${m+1}" width="${s-m*2-2}" height="${s-m*2-2}" rx="1" fill="none" stroke="${B}" stroke-width="2.5"/>`;
    case'prot_fija':return`<rect x="${m+2}" y="${m+2}" width="${s-m*2-4}" height="${s-m*2-4}" rx="1" fill="none" stroke="${B}" stroke-width="2" stroke-dasharray="4,2"/>`;
    case'prot_rem':return`<text x="${c-8}" y="${c+6}" font-size="20" fill="${R}" font-weight="bold">(</text><text x="${c+4}" y="${c+6}" font-size="20" fill="${R}" font-weight="bold">)</text>`;
    case'prot_tot_r':return`<line x1="${m+2}" y1="${c-5}" x2="${t-2}" y2="${c-5}" stroke="${R}" stroke-width="3"/><line x1="${m+2}" y1="${c+5}" x2="${t-2}" y2="${c+5}" stroke="${R}" stroke-width="3"/>`;
    case'prot_tot_b':return`<line x1="${m+2}" y1="${c-5}" x2="${t-2}" y2="${c-5}" stroke="${B}" stroke-width="3"/><line x1="${m+2}" y1="${c+5}" x2="${t-2}" y2="${c+5}" stroke="${B}" stroke-width="3"/>`;
    case'sell_nec':return`<text x="${c}" y="${c+8}" text-anchor="middle" font-size="28" fill="${R}" font-weight="bold">*</text>`;
    case'sell_real':return`<text x="${c}" y="${c+8}" text-anchor="middle" font-size="28" fill="${B}" font-weight="bold">*</text>`;
    default:return'';
  }
}

function buildToothSVG(num,sd,wd){
  const s=ODO_S,m=ODO_M,wo=wd[num];
  let p='';
  for(const z of ODO_ZONES){
    const sid=sd[num+'_'+z];
    let fill='#ffffff';
    if(!wo&&sid==='caries')fill='#E24B4A';
    if(!wo&&sid==='obturado')fill='#185FA5';
    p+=`<path d="${odoZP(z,s)}" fill="${fill}" stroke="#c8ccda" stroke-width="0.7" style="cursor:pointer" onclick="odoClickZone(event,${num},'${z}')"/>`;
  }
  const wov=wo?`<g style="pointer-events:none">${drawWS(wo,s)}</g>`:'';
  return`<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" style="display:block"><rect width="${s}" height="${s}" rx="3" fill="#fff" stroke="none"/>${p}<rect x="${m}" y="${m}" width="${s-m*2}" height="${s-m*2}" rx="2" fill="none" stroke="#a8adc0" stroke-width="0.9" style="pointer-events:none"/>${wov}</svg>`;
}

function legSVG(item,isSurf){
  const s=28,m=2;
  if(isSurf){
    const col=item.col,ps=ODO_ZONES.map(z=>`<path d="${odoZP(z,s)}" fill="${col}" stroke="rgba(255,255,255,.4)" stroke-width="0.4"/>`).join('');
    return`<svg width="28" height="28" viewBox="0 0 28 28" style="border-radius:4px;border:0.5px solid #e2e8f0;flex-shrink:0">${ps}<rect x="${m}" y="${m}" width="${s-m*2}" height="${s-m*2}" rx="1" fill="none" stroke="#a8adc0" stroke-width="0.6"/></svg>`;
  }
  return`<svg width="28" height="28" viewBox="0 0 28 28" style="border-radius:4px;border:0.5px solid #e2e8f0;flex-shrink:0;background:#fff"><rect x="${m}" y="${m}" width="${s-m*2}" height="${s-m*2}" rx="1" fill="#f8fafc" stroke="#a8adc0" stroke-width="0.6"/>${drawWS(item.id,s)}</svg>`;
}

const COLORS=['#0ea5e9','#10b981','#8b5cf6','#f59e0b','#ef4444','#ec4899','#06b6d4'];
const MONTHS=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

function initials(n){return n.split(' ').map(x=>x[0]).join('').substring(0,2).toUpperCase()}

function v(id){return document.getElementById(id)?.value||''}
function today(){return new Date().toISOString().split('T')[0]}
function fmtDate(d){if(!d)return'—';const dt=new Date(d+'T12:00');return`${dt.getDate()} ${MONTHS[dt.getMonth()]} ${dt.getFullYear()}`}
function calcAge(birthdate){
  if(!birthdate)return'—';
  const hoy=new Date();
  const nac=new Date(birthdate+'T12:00');
  let edad=hoy.getFullYear()-nac.getFullYear();
  const m=hoy.getMonth()-nac.getMonth();
  if(m<0||(m===0&&hoy.getDate()<nac.getDate()))edad--;
  return edad;
}
function genAutorizacion(){return Array.from({length:49},()=>Math.floor(Math.random()*10)).join('')}

function load(){
  const p=localStorage.getItem('oa3_pts');
  if(p){patients=JSON.parse(p);patients.forEach(pt=>{
    ['surfData','wholeData'].forEach(k=>{if(!pt[k])pt[k]={};});
    ['treatments','payments','appointments','diary','images','consents','recetas'].forEach(k=>{if(!pt[k])pt[k]=[];});
    // Migrate: remove stored age, use calcAge from birthdate
    if(pt.birthdate&&pt.age!==undefined) delete pt.age;
  });}
  const eg=localStorage.getItem('oa3_eg');if(eg)egresos=JSON.parse(eg);
  const fa=localStorage.getItem('oa3_fact');if(fa)facturas=JSON.parse(fa);
  const nid=localStorage.getItem('oa3_nid');if(nid)nextId=parseInt(nid);
  const neg=localStorage.getItem('oa3_neg');if(neg)nextEgId=parseInt(neg);
  const nfact=localStorage.getItem('oa3_nfact');if(nfact)nextFactId=parseInt(nfact);
  const nrec=localStorage.getItem('oa3_nreceta');if(nrec)nextRecetaId=parseInt(nrec);
  const arch=localStorage.getItem('oa3_arch');if(arch)archivosContables=JSON.parse(arch);
  const logo=localStorage.getItem('oa3_logo');
  if(logo){
    const l=JSON.parse(logo);
    document.getElementById('logoText').textContent=l.text||'OdontoApp';
    document.getElementById('logoProfesional').textContent=l.prof||'Dr. Profesional';
    logoColor=l.color||'#0ea5e9';logoImg=l.img||null;
    clinicaRUC=l.ruc||'';clinicaDireccion=l.dir||'';clinicaTelefono=l.tel||'';
    applyColor(logoColor);
    if(logoImg)applyLogoImg(logoImg);
  }
  if(patients.length===0)seedDemo();
}

function renderDashboard(){
  const now=new Date(),todayStr=today(),h=now.getHours();
  const greeting=h<12?'Buenos días':h<18?'Buenas tardes':'Buenas noches';
  const todayAppts=[];
  patients.forEach(p=>p.appointments.filter(a=>a.date===todayStr&&a.status!=='completada').forEach(a=>todayAppts.push({...a,ptName:p.name,ptId:p.id})));
  todayAppts.sort((a,b)=>a.time.localeCompare(b.time));
  const upcoming=[];
  patients.forEach(p=>p.appointments.filter(a=>a.date>todayStr&&a.status!=='completada').forEach(a=>upcoming.push({...a,ptName:p.name,ptId:p.id})));
  upcoming.sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));
  const bdToday=patients.filter(p=>{if(!p.birthdate)return false;const b=p.birthdate.split('-');return b[1]===String(now.getMonth()+1).padStart(2,'0')&&b[2]===String(now.getDate()).padStart(2,'0');});

function renderMonthView(allAppts, todayStr){
  const firstDay = new Date(calYear, calMonth, 1);
  const lastDay  = new Date(calYear, calMonth+1, 0);
  const startDow = (firstDay.getDay()+6)%7; // Monday=0
  const totalDays = lastDay.getDate();
  const DAYS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

  let html = `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border-radius:10px;overflow:hidden">`;
  // Header
  DAYS.forEach(d=>{ html+=`<div style="padding:8px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--text2);background:var(--bg)">${d}</div>`; });

  // Empty cells before month starts
  for(let i=0;i<startDow;i++) html+=`<div style="background:var(--card);min-height:90px"></div>`;

  for(let day=1;day<=totalDays;day++){
    const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isToday=dateStr===todayStr;
    const dayAppts=allAppts.filter(a=>a.date===dateStr).sort((a,b)=>a.time.localeCompare(b.time));
    const dow=(startDow+day-1)%7;
    const isWeekend=dow===5||dow===6;
    html+=`<div onclick="openQuickAppt('${dateStr}')" style="background:${isToday?'#eff6ff':isWeekend?'#fafafa':'var(--card)'};min-height:90px;padding:6px;cursor:pointer;transition:background .1s;position:relative" onmouseover="this.style.background='#f0f9ff'" onmouseout="this.style.background='${isToday?'#eff6ff':isWeekend?'#fafafa':'var(--card)'}'">
      <div style="font-size:13px;font-weight:${isToday?'700':'500'};color:${isToday?'#fff':'var(--text)'};width:22px;height:22px;border-radius:50%;background:${isToday?'var(--accent)':'transparent'};display:flex;align-items:center;justify-content:center;margin-bottom:3px">${day}</div>
      ${dayAppts.slice(0,3).map(a=>{
        const bg=a.status==='completada'?'#d1fae5':a.status==='no_asistio'?'#fee2e2':a.type==='quick'?'#fef3c7':'#dbeafe';
        const tc=a.status==='completada'?'#065f46':a.status==='no_asistio'?'#991b1b':a.type==='quick'?'#92400e':'#1e40af';
        return`<div onclick="event.stopPropagation();openApptDetail('${a.id}','${a.type}','${a.ptId||''}')" style="font-size:10px;padding:2px 5px;border-radius:4px;background:${bg};color:${tc};margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer">${a.time} ${a.ptName}</div>`;
      }).join('')}
      ${dayAppts.length>3?`<div style="font-size:10px;color:var(--text3);padding:1px 4px">+${dayAppts.length-3} más</div>`:''}
    </div>`;
  }
  // Fill remaining cells
  const total=startDow+totalDays;
  const rem=total%7===0?0:7-(total%7);
  for(let i=0;i<rem;i++) html+=`<div style="background:var(--card);min-height:90px"></div>`;
  html+=`</div>`;
  return html;
}

function renderWeekView(allAppts, todayStr){
  // Find Monday of current week based on calYear/calMonth/today
  const ref=new Date(calYear, calMonth, 1);
  const dow=(ref.getDay()+6)%7;
  const monday=new Date(ref); monday.setDate(ref.getDate()-dow);
  const days=[];
  for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);days.push(d);}
  const DNAMES=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const hours=['07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00'];

  let html=`<div style="display:grid;grid-template-columns:48px repeat(7,1fr);gap:1px;background:var(--border);border-radius:10px;overflow:hidden;max-height:520px;overflow-y:auto">`;
  // Header row
  html+=`<div style="background:var(--bg);padding:8px 4px"></div>`;
  days.forEach((d,i)=>{
    const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const isT=ds===todayStr;
    html+=`<div style="background:${isT?'#eff6ff':'var(--bg)'};padding:8px 4px;text-align:center">
      <div style="font-size:10px;font-weight:600;color:var(--text2)">${DNAMES[i]}</div>
      <div style="font-size:15px;font-weight:700;color:${isT?'var(--accent)':'var(--text)'}">${d.getDate()}</div>
    </div>`;
  });
  // Hour rows
  hours.forEach(hr=>{
    html+=`<div style="background:var(--card);padding:4px 6px;font-size:10px;color:var(--text3);text-align:right;border-top:1px solid var(--border)">${hr}</div>`;
    days.forEach(d=>{
      const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const hrAppts=allAppts.filter(a=>a.date===ds&&a.time.startsWith(hr.split(':')[0]));
      const isT=ds===todayStr;
      html+=`<div onclick="openQuickAppt('${ds}','${hr}')" style="background:${isT?'#fafeff':'var(--card)'};min-height:52px;padding:3px;border-top:1px solid var(--border);cursor:pointer;transition:background .1s" onmouseover="this.style.background='#f0f9ff'" onmouseout="this.style.background='${isT?'#fafeff':'var(--card)'}'">
        ${hrAppts.map(a=>{
          const bg=a.status==='completada'?'#d1fae5':a.type==='quick'?'#fef3c7':'#dbeafe';
          const tc=a.status==='completada'?'#065f46':a.type==='quick'?'#92400e':'#1e40af';
          return`<div onclick="event.stopPropagation();openApptDetail('${a.id}','${a.type}','${a.ptId||''}')" style="font-size:10px;padding:3px 5px;border-radius:5px;background:${bg};color:${tc};margin-bottom:2px;cursor:pointer;font-weight:500">${a.time} ${a.ptName}<br><span style="font-weight:400;opacity:.8">${a.reason}</span></div>`;
        }).join('')}
      </div>`;
    });
  });
  html+=`</div>`;
  return html;
}

function renderListView(allAppts, todayStr){
  const future=allAppts.filter(a=>a.date>=todayStr&&a.status!=='completada').sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));
  const past=allAppts.filter(a=>a.date<todayStr||a.status==='completada').sort((a,b)=>b.date.localeCompare(a.date)||b.time.localeCompare(a.time)).slice(0,20);

  if(future.length===0&&past.length===0) return`<div style="text-align:center;padding:40px;color:var(--text3)">Sin citas registradas. Haz clic en el calendario para agregar una.</div>`;

  let lastDate='';
  let html=`<div style="max-height:520px;overflow-y:auto">`;
  future.forEach(a=>{
    if(a.date!==lastDate){
      lastDate=a.date;
      const isToday=a.date===todayStr;
      html+=`<div style="font-size:11px;font-weight:700;color:${isToday?'var(--accent)':'var(--text2)'};padding:10px 0 4px;text-transform:uppercase;letter-spacing:.05em">${isToday?'HOY — ':''} ${fmtDate(a.date)}</div>`;
    }
    html+=listApptRow(a);
  });
  if(past.length){
    html+=`<div style="font-size:11px;font-weight:700;color:var(--text3);padding:14px 0 4px;text-transform:uppercase;letter-spacing:.05em;border-top:1px solid var(--border);margin-top:8px">Historial</div>`;
    past.forEach(a=>{ html+=listApptRow(a); });
  }
  html+=`</div>`;
  return html;
}

function setCalView(v){ calView=v; showPage('agenda'); }
function calPrev(){ if(calView==='week'){calMonth--;if(calMonth<0){calMonth=11;calYear--;}}else{calMonth--;if(calMonth<0){calMonth=11;calYear--;}} showPage('agenda'); }
function calNext(){ if(calView==='week'){calMonth++;if(calMonth>11){calMonth=0;calYear++;}}else{calMonth++;if(calMonth>11){calMonth=0;calYear++;}} showPage('agenda'); }

// Quick appointment (for patients who message to schedule)
function openQuickAppt(dateStr, timeStr){
  const ptOptions=`<option value="">— Sin ficha (cita rápida) —</option>`+patients.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  openModal(`<div class="modal-title">📅 Nueva cita</div>
  <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#1e40af">
    <strong>💬 Cita rápida:</strong> Si el paciente te escribió por mensaje pero no tiene ficha, completa solo los datos básicos. Luego podrás crear su ficha completa.
  </div>
  <div class="form-row form-full">
    <div class="form-group"><label>Paciente registrado (opcional)</label>
      <select id="f_qa_pt" onchange="fillQuickApptFromPt()">
        ${ptOptions}
      </select>
    </div>
  </div>
  <div style="background:var(--bg);border-radius:10px;padding:12px;margin-bottom:12px">
    <div style="font-size:11px;font-weight:700;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em">Datos del paciente</div>
    <div class="form-row"><div class="form-group"><label>Nombre *</label><input id="f_qa_name" placeholder="Nombre del paciente"></div><div class="form-group"><label>Teléfono</label><input id="f_qa_phone" placeholder="0987-654-321"></div></div>
  </div>
  <div class="form-row"><div class="form-group"><label>Fecha *</label><input id="f_qa_date" type="date" value="${dateStr||today()}"></div><div class="form-group"><label>Hora *</label><input id="f_qa_time" type="time" value="${timeStr||'09:00'}"></div></div>
  <div class="form-row form-full"><div class="form-group"><label>Motivo de la cita *</label><input id="f_qa_reason" placeholder="Consulta, limpieza, dolor, extracción..."></div></div>
  <div class="form-row form-full"><div class="form-group"><label>Notas adicionales</label><input id="f_qa_notes" placeholder="Canal de agendamiento, observaciones..."></div></div>
  <div class="modal-footer"><button class="btn-sec" onclick="closeModal()">Cancelar</button><button class="btn-primary" onclick="saveQuickAppt()">Guardar cita</button></div>`);

function fillQuickApptFromPt(){
  const ptId=parseInt(v('f_qa_pt'));
  if(!ptId){document.getElementById('f_qa_name').value='';document.getElementById('f_qa_phone').value='';return;}
  const p=patients.find(x=>x.id===ptId);if(!p)return;
  document.getElementById('f_qa_name').value=p.name;
  document.getElementById('f_qa_phone').value=p.phone;
}

function saveQuickAppt(){
  const name=v('f_qa_name').trim();if(!name){alert('El nombre es obligatorio');return;}
  const reason=v('f_qa_reason').trim();if(!reason){alert('El motivo es obligatorio');return;}
  const ptId=parseInt(v('f_qa_pt'));
  const date=v('f_qa_date'), time=v('f_qa_time');

  if(ptId){
    // Save to registered patient's appointments
    const p=patients.find(x=>x.id===ptId);
    if(p){
      p.appointments.push({id:Date.now(),reason,date,time,status:'pendiente',notes:v('f_qa_notes')});
      save();closeModal();showPage('agenda');return;
    }
  }
  // Quick appointment (no patient file)
  if(!quickAppts) quickAppts=[];
  quickAppts.push({id:'q'+Date.now(),ptName:name,phone:v('f_qa_phone'),reason,date,time,status:'pendiente',notes:v('f_qa_notes'),type:'quick'});
  saveQuickAppts();closeModal();showPage('agenda');
}

function openApptDetail(id, type, ptId){
  let appt=null;
  if(type==='registered'){
    const p=patients.find(x=>x.id===parseInt(ptId));
    if(p) appt=p.appointments.find(a=>String(a.id)===String(id));
    if(appt) appt={...appt,ptName:p.name,ptId:p.id,type:'registered'};
  } else {
    appt=(quickAppts||[]).find(a=>String(a.id)===String(id));
  }
  if(!appt)return;

  const statusOpts=['pendiente','completada','no_asistio'].map(s=>`<option value="${s}"${appt.status===s?' selected':''}>${s==='pendiente'?'Pendiente':s==='completada'?'Completada':'No asistió'}</option>`).join('');
  openModal(`<div class="modal-title">Detalle de cita</div>
  <div style="background:var(--bg);border-radius:10px;padding:14px;margin-bottom:14px">
    <div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px">${appt.ptName}</div>
    ${appt.phone?`<div style="font-size:12px;color:var(--text2);margin-bottom:2px">📞 ${appt.phone}</div>`:''}
    <div style="font-size:13px;color:var(--text2)">📅 ${fmtDate(appt.date)} — ${appt.time}</div>
    <div style="font-size:13px;color:var(--text2);margin-top:4px">🦷 ${appt.reason}</div>
    ${appt.notes?`<div style="font-size:12px;color:var(--text3);margin-top:4px">📝 ${appt.notes}</div>`:''}
    ${appt.type==='quick'?`<div style="margin-top:8px;padding:6px 10px;background:#fef3c7;border-radius:7px;font-size:11px;color:#92400e">💬 Cita rápida — sin ficha de paciente</div>`:''}
  </div>
  <div class="form-row"><div class="form-group"><label>Fecha</label><input id="f_ad_date" type="date" value="${appt.date}"></div><div class="form-group"><label>Hora</label><input id="f_ad_time" type="time" value="${appt.time}"></div></div>
  <div class="form-row form-full"><div class="form-group"><label>Motivo</label><input id="f_ad_reason" value="${appt.reason}"></div></div>
  <div class="form-row form-full"><div class="form-group"><label>Estado</label><select id="f_ad_status">${statusOpts}</select></div></div>
  <div class="modal-footer" style="justify-content:space-between">
    <div style="display:flex;gap:8px">
      <button class="btn-sec" style="color:var(--red);border-color:#fca5a5" onclick="deleteApptDetail('${id}','${type}','${ptId}')">Eliminar</button>
      ${type==='quick'?`<button class="btn-sec" onclick="convertToPatient('${id}')">Crear ficha</button>`:`<button class="btn-sec" onclick="closeModal();selectPt(${ptId})">Ver ficha</button>`}
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn-sec" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveApptDetail('${id}','${type}','${ptId}')">Guardar</button>
    </div>
  </div>`);
}

function saveApptDetail(id,type,ptId){
  if(type==='registered'){
    const p=patients.find(x=>x.id===parseInt(ptId));
    const a=p?.appointments.find(a=>String(a.id)===String(id));
    if(a){a.date=v('f_ad_date');a.time=v('f_ad_time');a.reason=v('f_ad_reason');a.status=v('f_ad_status');save();}
  } else {
    const a=(quickAppts||[]).find(a=>String(a.id)===String(id));
    if(a){a.date=v('f_ad_date');a.time=v('f_ad_time');a.reason=v('f_ad_reason');a.status=v('f_ad_status');saveQuickAppts();}
  }
  closeModal();showPage('agenda');
}

function deleteApptDetail(id,type,ptId){
  if(!confirm('¿Eliminar esta cita?'))return;
  if(type==='registered'){
    const p=patients.find(x=>x.id===parseInt(ptId));
    if(p){p.appointments=p.appointments.filter(a=>String(a.id)!==String(id));save();}
  } else {
    quickAppts=(quickAppts||[]).filter(a=>String(a.id)!==String(id));saveQuickAppts();
  }
  closeModal();showPage('agenda');
}

function convertToPatient(qId){
  const qa=(quickAppts||[]).find(a=>String(a.id)===String(qId));if(!qa)return;
  closeModal();
  openModal(`<div class="modal-title">Crear ficha de paciente</div>
  <p style="font-size:13px;color:var(--text2);margin-bottom:14px">Se creará una ficha completa para <strong>${qa.ptName}</strong> y la cita quedará asociada a ella.</p>
  <div class="form-row"><div class="form-group"><label>Nombre completo *</label><input id="f_name" value="${qa.ptName}"></div><div class="form-group"><label>Cédula / ID</label><input id="f_ced"></div></div>
  <div class="form-row"><div class="form-group"><label>Fecha nacimiento</label><input id="f_birth" type="date"></div><div class="form-group"><label>Teléfono</label><input id="f_phone" value="${qa.phone||''}"></div></div>
  <div class="form-row"><div class="form-group"><label>Email</label><input id="f_email" type="email"></div><div class="form-group"><label>Fecha nacimiento</label><input id="f_birth" type="date"></div></div>
  <div class="form-row form-full"><div class="form-group"><label>Alergias</label><input id="f_al" placeholder="Penicilina, látex..."></div></div>
  <div class="form-row form-full"><div class="form-group"><label>Antecedentes médicos</label><textarea id="f_ant"></textarea></div></div>
  <div class="modal-footer"><button class="btn-sec" onclick="closeModal()">Cancelar</button><button class="btn-primary" onclick="confirmConvert('${qId}')">Crear ficha y asociar cita</button></div>`);
}

function confirmConvert(qId){
  const name=v('f_name').trim();if(!name){alert('El nombre es obligatorio');return;}
  const qa=(quickAppts||[]).find(a=>String(a.id)===String(qId));if(!qa)return;
  const newPt={id:nextId++,name,cedula:v('f_ced'),birthdate:v('f_birth'),phone:v('f_phone'),email:v('f_email'),alergias:v('f_al'),antecedentes:v('f_ant'),surfData:{},wholeData:{},diary:[],treatments:[],payments:[],images:[],consents:[],
    appointments:[{id:Date.now(),reason:qa.reason,date:qa.date,time:qa.time,status:qa.status,notes:qa.notes}]};
  patients.push(newPt);
  quickAppts=(quickAppts||[]).filter(a=>String(a.id)!==String(qId));
  save();saveQuickAppts();closeModal();renderSidebar();selectPt(newPt.id);
}

function saveQuickAppts(){ localStorage.setItem('oa3_qa', JSON.stringify(quickAppts||[])); }
function loadQuickAppts(){ const d=localStorage.getItem('oa3_qa'); quickAppts=d?JSON.parse(d):[]; }

// ═══ ESTADÍSTICAS ═══
function renderEstadisticas(){
  const now=new Date();
  const curY=now.getFullYear();
  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const m=d.getMonth(),y=d.getFullYear();
    const inc=patients.reduce((s,p)=>s+p.payments.filter(py=>{const pd=new Date(py.date+'T12:00');return pd.getMonth()===m&&pd.getFullYear()===y&&!py.archivado;}).reduce((a,py)=>a+py.amount,0),0);
    const eg=egresos.filter(e=>{const ed=new Date(e.fecha+'T12:00');return ed.getMonth()===m&&ed.getFullYear()===y&&!e.archivado;}).reduce((s,e)=>s+e.monto,0);
    months.push({label:MONTHS[m],inc,eg,util:inc-eg});
  }
  const maxVal=Math.max(...months.map(m=>Math.max(m.inc,m.eg)),1);
  const totalDebt=patients.reduce((s,p)=>{const txT=p.treatments.reduce((a,t)=>a+t.cost,0),paid=p.payments.reduce((a,py)=>a+py.amount,0);return s+Math.max(0,txT-paid);},0);
  // Current month totals — only non-archived (reset when month is closed)
  const curM=now.getMonth(),curYr=now.getFullYear();
  const mInc=patients.reduce((s,p)=>s+p.payments.filter(py=>{const d=new Date(py.date+'T12:00');return d.getMonth()===curM&&d.getFullYear()===curYr&&!py.archivado;}).reduce((a,py)=>a+py.amount,0),0);
  const mEg=egresos.filter(e=>{const d=new Date(e.fecha+'T12:00');return d.getMonth()===curM&&d.getFullYear()===curYr&&!e.archivado;}).reduce((s,e)=>s+e.monto,0);
  const curMonthName=MONTHS_FULL[now.getMonth()];

  // Build yearly archive summary for current year
  const archYear=archivosContables.filter(a=>a.anio===curY).sort((a,b)=>a.mes-b.mes);
  const archTotalInc=archYear.reduce((s,a)=>s+a.totalIngresos,0);
  const archTotalEg=archYear.reduce((s,a)=>s+a.totalEgresos,0);

  // Live months not yet archived
  const liveInc=patients.reduce((s,p)=>s+p.payments.filter(py=>{const d=new Date(py.date+'T12:00');return d.getFullYear()===curY&&!py.archivado;}).reduce((a,py)=>a+py.amount,0),0);
  const liveEg=egresos.filter(e=>new Date(e.fecha+'T12:00').getFullYear()===curY&&!e.archivado).reduce((s,e)=>s+e.monto,0);
  const yearTotalInc=archTotalInc+liveInc;
  const yearTotalEg=archTotalEg+liveEg;

  return`
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
    <div style="font-size:16px;font-weight:700;color:var(--text)">Estadísticas financieras</div>
    <div style="display:flex;gap:8px">
      <button class="btn-sm" onclick="descargarInformeMensual()" style="background:var(--green);color:#fff;border-color:var(--green)">📥 Informe ${curMonthName}</button>
      <button class="btn-sm" onclick="abrirResetMes()" style="color:var(--red);border-color:#fca5a5">🗂 Cerrar mes</button>
    </div>
  </div>

  <div class="grid4" style="margin-bottom:16px">
    <div class="kpi"><div class="kpi-label">Ingresos ${curMonthName}</div><div class="kpi-val" style="color:var(--green)">$${mInc.toFixed(2)}</div><div class="kpi-sub">Se reinicia al cerrar mes</div></div>
    <div class="kpi"><div class="kpi-label">Egresos ${curMonthName}</div><div class="kpi-val" style="color:var(--red)">$${mEg.toFixed(2)}</div><div class="kpi-sub">Se reinicia al cerrar mes</div></div>
    <div class="kpi"><div class="kpi-label">Utilidad ${curMonthName}</div><div class="kpi-val" style="color:${mInc-mEg>=0?'var(--green)':'var(--red)'}">$${(mInc-mEg).toFixed(2)}</div><div class="kpi-sub">Se reinicia al cerrar mes</div></div>
    <div class="kpi"><div class="kpi-label">Cartera pendiente</div><div class="kpi-val" style="color:var(--amber)">$${totalDebt.toFixed(2)}</div><div class="kpi-sub">Acumulado permanente</div></div>
  </div>

  ${archYear.length>0?`
  <div class="card" style="margin-bottom:14px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div class="card-title" style="margin:0">📊 Resumen anual ${curY} — meses cerrados</div>
      <button class="btn-sm" onclick="descargarInformeAnual(${curY})" style="background:var(--accent);color:#fff;border-color:var(--accent)">📥 Informe anual</button>
    </div>
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:12px">

function abrirResetMes(){
  const now=new Date();
  const opts=[];
  for(let i=0;i<12;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const m=d.getMonth(),y=d.getFullYear();
    const yaArchivado=archivosContables.some(a=>a.mes===m&&a.anio===y);
    const inc=patients.reduce((s,p)=>s+p.payments.filter(py=>{const pd=new Date(py.date+'T12:00');return pd.getMonth()===m&&pd.getFullYear()===y&&!py.archivado;}).reduce((a,py)=>a+py.amount,0),0);
    const eg=egresos.filter(e=>{const ed=new Date(e.fecha+'T12:00');return ed.getMonth()===m&&ed.getFullYear()===y&&!e.archivado;}).reduce((s,e)=>s+e.monto,0);
    opts.push({m,y,label:`${MONTHS_FULL[m]} ${y}`,inc,eg,yaArchivado});
  }
  openModal(`<div class="modal-title">🗂 Cerrar y archivar mes</div>
  <div style="background:#dbeafe;border:1px solid #93c5fd;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:12px;color:#1e40af">
    <strong>¿Cómo funciona?</strong> Al cerrar un mes, se guarda un snapshot con todos los ingresos y egresos de ese período. Luego puedes eliminar esos datos del sistema activo sin perder el historial. Al final del año verás el resumen completo mes a mes.
  </div>
  <div style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Selecciona el mes a cerrar</div>
  <div style="max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:6px">
    ${opts.map(o=>`
      <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid ${o.yaArchivado?'#86efac':'var(--border)'};border-radius:10px;background:${o.yaArchivado?'#f0fdf4':'var(--bg)'}">
        <div style="flex:1">
          <div style="font-size:13px;font-weight:600;color:var(--text)">${o.label}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px">
            Ingresos: <span style="color:var(--green);font-weight:600">$${o.inc.toFixed(2)}</span> ·
            Egresos: <span style="color:var(--red);font-weight:600">$${o.eg.toFixed(2)}</span> ·
            Utilidad: <span style="font-weight:600;color:${o.inc-o.eg>=0?'var(--green)':'var(--red)'}">$${(o.inc-o.eg).toFixed(2)}</span>
          </div>
        </div>
        ${o.yaArchivado
          ?`<span style="font-size:11px;font-weight:600;color:#15803d;background:#d1fae5;padding:3px 10px;border-radius:20px">✓ Archivado</span>`
          :(o.inc>0||o.eg>0)
            ?`<button onclick="cerrarMes(${o.m},${o.y})" style="padding:7px 14px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap">🗂 Cerrar mes</button>`
            :`<span style="font-size:11px;color:var(--text3)">Sin movimientos</span>`
        }
      </div>`).join('')}
  </div>
  <div class="modal-footer"><button class="btn-sec" onclick="closeModal()">Cerrar</button></div>`);
  document.querySelector('.modal').style.width='580px';
}

function cerrarMes(m,y){
  const mesNombre=`${MONTHS_FULL[m]} ${y}`;
  const pagos=[];
  patients.forEach(p=>{
    p.payments.filter(py=>{const d=new Date(py.date+'T12:00');return d.getMonth()===m&&d.getFullYear()===y&&!py.archivado;})
      .forEach(py=>pagos.push({paciente:p.name,cedula:p.cedula,concepto:py.concept,monto:py.amount,fecha:py.date,tipo:py.type,ptId:p.id,pagoId:py.id}));
  });
  const egresosM=egresos.filter(e=>{const d=new Date(e.fecha+'T12:00');return d.getMonth()===m&&d.getFullYear()===y&&!e.archivado;});
  const totalIngresos=pagos.reduce((s,p)=>s+p.monto,0);
  const totalEgresos=egresosM.reduce((s,e)=>s+e.monto,0);

  if(!totalIngresos&&!totalEgresos){alert('No hay movimientos activos en este mes para cerrar.');return;}

  if(!confirm(`¿Cerrar y archivar ${mesNombre}?\n\n📊 Resumen:\n• Ingresos: $${totalIngresos.toFixed(2)}\n• Egresos: $${totalEgresos.toFixed(2)}\n• Utilidad: $${(totalIngresos-totalEgresos).toFixed(2)}\n\nLos contadores mensuales se reiniciarán.\nLa cartera pendiente se mantiene intacta.`))return;

  // Save archive snapshot
  archivosContables.push({
    id:Date.now(),
    mes:m, anio:y,
    label:mesNombre,
    fechaCierre:today(),
    pagos, egresos:egresosM,
    totalIngresos, totalEgresos,
    utilidad:totalIngresos-totalEgresos,
    pacientesAtendidos:[...new Set(pagos.map(p=>p.paciente))].length
  });

  // Mark payments as archived (NOT deleted — cartera pendiente stays correct)
  patients.forEach(p=>{
    p.payments.forEach(py=>{
      const d=new Date(py.date+'T12:00');
      if(d.getMonth()===m&&d.getFullYear()===y)py.archivado=true;
    });
  });
  // Mark egresos as archived
  egresos.forEach(e=>{
    const d=new Date(e.fecha+'T12:00');
    if(d.getMonth()===m&&d.getFullYear()===y)e.archivado=true;
  });

  save();
  closeModal();
  showPage('estadisticas');
  alert(`✓ ${mesNombre} cerrado correctamente.\n\nIngresos, egresos y utilidad reiniciados.\nLa cartera pendiente se mantiene intacta.`);
}

function descargarInformeMensual(){
  const now=new Date();
  const m=now.getMonth(),y=now.getFullYear();
  const mesNombre=`${MONTHS_FULL[m]} ${y}`;
  const pagos=[];
  patients.forEach(p=>{
    p.payments.filter(py=>{const d=new Date(py.date+'T12:00');return d.getMonth()===m&&d.getFullYear()===y;})
      .forEach(py=>pagos.push({paciente:p.name,cedula:p.cedula,concepto:py.concept,monto:py.amount,fecha:py.date,tipo:py.type}));
  });
  const egresosM=egresos.filter(e=>{const d=new Date(e.fecha+'T12:00');return d.getMonth()===m&&d.getFullYear()===y;});
  const totalInc=pagos.reduce((s,p)=>s+p.monto,0);
  const totalEg=egresosM.reduce((s,e)=>s+e.monto,0);
  const pacientes=[...new Set(pagos.map(p=>p.paciente))].length;
  _generarInformeHTML(mesNombre,pagos,egresosM,totalInc,totalEg,totalInc-totalEg,pacientes,today());
}

function fillClienteFact(){
  const sel=document.getElementById('f_fpt');
  const ptId=parseInt(sel.value);
  if(!ptId)return;
  const p=patients.find(x=>x.id===ptId);
  if(!p)return;
  document.getElementById('f_fnombre').value=p.name;
  document.getElementById('f_fced').value=p.cedula;
  document.getElementById('f_ftel').value=p.phone;
}

function saveFactura(){
  const nombre=v('f_fnombre').trim();if(!nombre){alert('El nombre del cliente es obligatorio');return;}
  const items=[];
  document.querySelectorAll('[id^="fact-item-"]').forEach(row=>{
    const id=row.id.replace('fact-item-','');
    const desc=document.getElementById(`fi_desc_${id}`)?.value?.trim();
    if(!desc)return;
    const cant=parseFloat(document.getElementById(`fi_cant_${id}`)?.value)||1;
    const precio=parseFloat(document.getElementById(`fi_precio_${id}`)?.value)||0;
    const desc2=parseFloat(document.getElementById(`fi_desc2_${id}`)?.value)||0;
    items.push({cantidad:cant,descripcion:desc,precio,descuento:desc2});
  });
  if(items.length===0){alert('Agrega al menos un servicio');return;}
  const subtotal0=items.reduce((s,i)=>s+(i.cantidad*i.precio-i.descuento),0);
  const iva=0;
  const total=subtotal0;
  facturas.push({
    id:nextFactId++,fecha:v('f_fdate'),formaPago:v('f_fpago'),ambiente:v('f_famb'),
    clienteNombre:nombre,clienteCedula:v('f_fced'),clienteTelefono:v('f_ftel'),clienteDireccion:v('f_fdir'),
    items,subtotal:0,subtotal0,iva,total,estado:'AUTORIZADA',autorizacion:genAutorizacion()
  });
  save();closeModal();showPage('facturacion');
}

function verFactura(id){
  const f=facturas.find(x=>x.id===id);if(!f)return;
  openModal(`<div class="modal-title">Factura N° ${String(f.id).padStart(9,'0')}</div>${renderFacturaPreview(f)}

function delFactura(id){if(!confirm('¿Anular esta factura?'))return;facturas=facturas.filter(f=>f.id!==id);save();showPage('facturacion');}

function buildToothSVGSmall(n,surfData,wholeData){
  // Reuse the full buildToothSVG but at 28px size
  const S=28,M=2,wo=wholeData[n];
  let p='';
  for(const z of ODO_ZONES){
    const sid=surfData[n+'_'+z];
    let fill='#ffffff';
    if(!wo&&sid==='caries')fill='#E24B4A';
    if(!wo&&sid==='obturado')fill='#185FA5';
    // Compute zone path at size S
    const t=S-M,c=S/2;
    let d='';
    if(z==='top')    d=`M${M},${M}L${t},${M}L${c},${c}Z`;
    else if(z==='right')  d=`M${t},${M}L${t},${t}L${c},${c}Z`;
    else if(z==='bottom') d=`M${t},${t}L${M},${t}L${c},${c}Z`;
    else if(z==='left')   d=`M${M},${t}L${M},${M}L${c},${c}Z`;
    else d=`M${c-7},${c-7}L${c+7},${c-7}L${c+7},${c+7}L${c-7},${c+7}Z`;
    p+=`<path d="${d}" fill="${fill}" stroke="#c8ccda" stroke-width="0.5"/>`;
  }
  const wov=wo?`<g style="pointer-events:none">${drawWS(wo,S)}</g>`:'';
  return`<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" style="display:block"><rect width="${S}" height="${S}" rx="2" fill="#fff"/>${p}<rect x="${M}" y="${M}" width="${S-M*2}" height="${S-M*2}" rx="1" fill="none" stroke="#a8adc0" stroke-width="0.7" style="pointer-events:none"/>${wov}</svg>`;
}

function savePay(){
  const amt=parseFloat(v('f_pya'));
  if(!amt||amt<=0)return;
  const pago={id:Date.now(),concept:v('f_pyc')||'Pago',amount:amt,date:v('f_pyd'),type:v('f_pyt'),factPendiente:true};
  curPt.payments.push(pago);
  save();
  closeModal();
  renderTab();
  // Auto-show invoice reminder
  setTimeout(()=>recordatorioFactura(pago),300);
}

function renderCitas(){
  const p=curPt,todayStr=today(),pend=p.appointments.filter(a=>a.status!=='completada'),done=p.appointments.filter(a=>a.status==='completada');
  return`<div class="card">
    <div class="action-row"><div class="card-title" style="margin:0">Citas programadas</div><button class="btn-primary" onclick="openAddAppt()">+ Nueva cita</button></div>
    ${pend.length?pend.map(a=>{const d=new Date(a.date+'T12:00');return`<div class="row-item"><div class="appt-date-box"><div class="appt-day">${d.getDate()}</div><div class="appt-mon">${MONTHS[d.getMonth()]}</div></div><div style="flex:1"><div class="row-name">${a.reason}</div><div class="row-meta">${a.time}${a.date===todayStr?' · <b style="color:var(--accent)">HOY</b>':''}</div></div><button class="comp-btn" onclick="compAppt(${a.id})">Completar</button><button class="del-btn" style="margin-left:6px" onclick="delAppt(${a.id})">✕</button></div>`;}).join(''):`<div style="font-size:13px;color:var(--text3);padding:8px 0">Sin citas programadas</div>`}
  </div>
  ${done.length?`<div class="card"><div class="card-title">Citas completadas</div>${done.slice().reverse().map(a=>{const d=new Date(a.date+'T12:00');return`<div class="row-item"><div class="appt-date-box"><div class="appt-day">${d.getDate()}</div><div class="appt-mon">${MONTHS[d.getMonth()]}</div></div><div style="flex:1"><div class="row-name">${a.reason}</div><div class="row-meta">${a.time}</div></div><span class="badge badge-green">Completada</span><button class="del-btn" style="margin-left:8px" onclick="delAppt(${a.id})">✕</button></div>`;}).join('')}</div>`:''}`;

function compAppt(id){const a=curPt.appointments.find(x=>x.id===id);if(a){a.status='completada';save();renderTab();}}
function delAppt(id){if(!confirm('¿Eliminar?'))return;curPt.appointments=curPt.appointments.filter(x=>x.id!==id);save();renderTab();}
function openAddAppt(){
  openModal(`<div class="modal-title">Nueva cita</div>
  <div class="form-row form-full"><div class="form-group"><label>Motivo *</label><input id="f_apr" placeholder="Control, limpieza, extracción..."></div></div>

function saveAppt(){const r=v('f_apr').trim();if(!r)return;curPt.appointments.push({id:Date.now(),reason:r,date:v('f_apd'),time:v('f_apt'),status:'pendiente'});save();closeModal();renderTab();}

  </div>`;

function handleImgUpload(e){
  const files=Array.from(e.target.files);
  if(!curPt.images)curPt.images=[];
  let processed=0;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=function(ev){
      curPt.images.push({id:Date.now()+processed,name:file.name.replace(/\.[^.]+$/,''),tipo:'Radiografía periapical',fecha:today(),data:ev.target.result,notas:''});
      processed++;
      if(processed===files.length){save();renderTab();}
    };
    reader.readAsDataURL(file);
  });
}

function viewImg(id){
  const img=curPt.images.find(x=>x.id===id);if(!img)return;
  const cats=['Radiografía periapical','Radiografía panorámica','Radiografía bitewing','Fotografía clínica','Fotografía extraoral','Fotografía intraoral','Otro'];
  openModal(`<div class="modal-title">Imagen — ${img.name}</div>
  <img src="${img.data}" style="width:100%;max-height:360px;object-fit:contain;border-radius:10px;background:#0f172a;margin-bottom:14px">
  <div class="form-row"><div class="form-group"><label>Nombre</label><input id="f_iname" value="${img.name}"></div><div class="form-group"><label>Tipo</label><select id="f_itipo">${cats.map(c=>`<option${c===img.tipo?' selected':''}>${c}</option>`).join('')}</select></div></div>
  <div class="form-row"><div class="form-group"><label>Fecha</label><input id="f_ifecha" type="date" value="${img.fecha}"></div><div class="form-group"><label>Notas</label><input id="f_inotas" value="${img.notas||''}"></div></div>
  <div class="modal-footer"><button class="btn-sec" onclick="closeModal()">Cerrar</button><button class="btn-primary" onclick="saveImgEdit(${id})">Guardar cambios</button></div>`);
  document.querySelector('.modal').style.width='640px';
}

function saveImgEdit(id){
  const img=curPt.images.find(x=>x.id===id);if(!img)return;
  img.name=v('f_iname');img.tipo=v('f_itipo');img.fecha=v('f_ifecha');img.notas=v('f_inotas');
  save();closeModal();renderTab();
}

function delImg(id){
  if(!confirm('¿Eliminar esta imagen?'))return;
  curPt.images=curPt.images.filter(x=>x.id!==id);
  save();renderTab();
}

function getDefaultWAMsg(){
  return `Hola {nombre} 👋\n\nLe recordamos que tiene una cita dental programada:\n\n📅 Fecha: {fecha}\n🕐 Hora: {hora}\n🦷 Motivo: {motivo}\n🏥 {clinica}\n\nPor favor confirme su asistencia o avísenos con anticipación si necesita reagendar.\n\n¡Le esperamos! 😊`;
}

function buildWAMsg(appt, ptName){
  const clinica=document.getElementById('logoText').textContent;
  const template=localStorage.getItem('oa3_wamsg')||getDefaultWAMsg();
  return template
    .replace(/{nombre}/g, ptName)
    .replace(/{fecha}/g, fmtDate(appt.date))
    .replace(/{hora}/g, appt.time)
    .replace(/{motivo}/g, appt.reason||'Consulta dental')
    .replace(/{clinica}/g, clinica);
}

function enviarWA(phone, appt, ptName){
  if(!phone||phone.trim()===''){
    alert(`${ptName} no tiene número de teléfono registrado.\nAgrégalo en su ficha para poder enviar WhatsApp.`);
    return;
  }
  // Clean phone number — remove spaces, dashes, keep + and digits
  let num=phone.replace(/[\s\-\(\)]/g,'');
  // Add Ecuador country code if not present
  if(num.startsWith('0'))num='593'+num.slice(1);
  else if(!num.startsWith('+')&&!num.startsWith('593'))num='593'+num;
  num=num.replace('+','');
  const msg=encodeURIComponent(buildWAMsg(appt,ptName));
  window.open(`https://wa.me/${num}?text=${msg}`,'_blank');
}

function factoryReset(){

function agregarMed(){
  const input=document.getElementById('f_new_med');
  const nombre=input?.value?.trim();
  if(!nombre){alert('Escribe el nombre del medicamento');return;}
  if(MEDICAMENTOS_COMUNES.includes(nombre)){alert('Este medicamento ya existe en la lista');return;}
  MEDICAMENTOS_COMUNES.push(nombre);
  saveMeds();
  const list=document.getElementById('meds-list');
  if(list){
    const div=document.createElement('div');
    div.style.cssText='display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--card);border-radius:7px;margin-bottom:4px;border:1px solid var(--border)';
    const idx=MEDICAMENTOS_COMUNES.length-1;
    div.innerHTML=`<div style="font-size:13px;flex:1;color:var(--text)">💊 ${nombre}</div>
      <button onclick="eliminarMed(${idx})" style="padding:3px 8px;font-size:11px;background:#fee2e2;color:var(--red);border:none;border-radius:5px;cursor:pointer;font-weight:600">✕</button>`;
    list.appendChild(div);
    list.scrollTop=list.scrollHeight;
  }
  input.value='';input.focus();
}

function eliminarMed(idx){
  if(!confirm(`¿Eliminar "${MEDICAMENTOS_COMUNES[idx]}" de la lista?`))return;
  MEDICAMENTOS_COMUNES.splice(idx,1);
  saveMeds();
  // Refresh modal medication list
  const list=document.getElementById('meds-list');
  if(list){
    list.innerHTML=MEDICAMENTOS_COMUNES.map((m,i)=>`
      <div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--card);border-radius:7px;margin-bottom:4px;border:1px solid var(--border)">
        <div style="font-size:13px;flex:1;color:var(--text)">💊 ${m}</div>
        <button onclick="eliminarMed(${i})" style="padding:3px 8px;font-size:11px;background:#fee2e2;color:var(--red);border:none;border-radius:5px;cursor:pointer;font-weight:600">✕</button>

}

function buscarCIE10(query){
  if(!query||query.length<2)return[];
  const q=query.toUpperCase().trim();
  const byCode=CIE10_ODO.filter(([cod])=>cod.startsWith(q));
  const byDesc=CIE10_ODO.filter(([cod,desc])=>!cod.startsWith(q)&&desc.includes(q));
  return [...byCode,...byDesc].slice(0,8);
}

function diagCieInput(e,id){
  activeDiagId=id;
  const q=e.target.value;
  const results=buscarCIE10(q);
  showDiagResults(id,results,true);
}

function diagDescInput(e,id){
  activeDiagId=id;
  const q=e.target.value;
  const results=buscarCIE10(q);
  showDiagResults(id,results,false);
}

function showDiagResults(id,results,fromCode){
  const box=document.getElementById(`diag-results-${id}`);
  if(!box)return;
  if(!results.length){box.style.display='none';return;}
  box.style.display='block';
  box.innerHTML=results.map(([cod,desc])=>`
    <div onclick="selectDiag(${id},'${cod}','${desc.replace(/'/g,"\\'")}','${fromCode}')"
      style="padding:8px 12px;cursor:pointer;font-size:11px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;background:var(--card)"
      onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background='var(--card)'">
      <span style="font-weight:700;color:var(--accent);min-width:44px;font-family:monospace;font-size:12px">${cod}</span>
      <span style="color:var(--text)">${desc}</span>
    </div>`).join('');
}

function selectDiag(id,cod,desc){
  const cieEl=document.getElementById(`dcie_${id}`);
  const descEl=document.getElementById(`ddesc_${id}`);
  const box=document.getElementById(`diag-results-${id}`);
  if(cieEl)cieEl.value=cod;
  if(descEl)descEl.value=desc;
  if(box)box.style.display='none';
}

function saveReceta(){
  // Collect diagnoses
  const diagnosticos=[];
  document.querySelectorAll('[id^="diag-item-"]').forEach(row=>{
    const id=row.id.replace('diag-item-','');
    const cod=document.getElementById(`dcie_${id}`)?.value?.trim().toUpperCase();
    const desc=document.getElementById(`ddesc_${id}`)?.value?.trim();
    if(cod||desc) diagnosticos.push({cod:cod||'',desc:desc||''});
  });
  // Collect medications
  const meds=[];
  document.querySelectorAll('[id^="med-item-"]').forEach(row=>{
    const id=row.id.replace('med-item-','');
    const nombre=document.getElementById(`mn_${id}`)?.value?.trim();
    if(!nombre)return;
    meds.push({nombre,dosis:document.getElementById(`md_${id}`)?.value||'',frecuencia:document.getElementById(`mf_${id}`)?.value||'',duracion:document.getElementById(`mdu_${id}`)?.value||'',via:document.getElementById(`mv_${id}`)?.value||'Oral'});
  });
  if(meds.length===0){alert('Agrega al menos un medicamento');return;}
  if(!curPt.recetas)curPt.recetas=[];
  curPt.recetas.push({
    id:nextRecetaId++,
    fecha:v('f_rdate'),medico:v('f_rmed'),especialidad:v('f_resp'),registro:v('f_rreg'),
    diagnosticos,
    // Legacy single-diag compat
    cie10cod:diagnosticos[0]?.cod||'',diagnostico:diagnosticos[0]?.desc||'',
    indicaciones:v('f_rind'),medicamentos:meds,
    paciente:curPt.name,cedula:curPt.cedula,edad:calcAge(curPt.birthdate)
  });
  save();closeModal();medItemCount=0;diagItemCount=0;renderTab();
}

function exportarDatos(){
  const logoInfo={
    clinicaNombre:document.getElementById('logoText').textContent,
    profesional:document.getElementById('logoProfesional').textContent,
    ruc:clinicaRUC,direccion:clinicaDireccion,telefono:clinicaTelefono
  };
  const backup={
    version:'OdontoApp_v3',
    fechaExportacion:new Date().toISOString(),
    clinica:logoInfo,
    totalPacientes:patients.length,
    totalFacturas:facturas.length,
    totalEgresos:egresos.length,
    patients,egresos,facturas,
    nextId,nextEgId,nextFactId,nextRecetaId
  };
  // Strip base64 images to reduce file size (optional: keep them)
  const backupStr=JSON.stringify(backup,null,2);
  const blob=new Blob([backupStr],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const fecha=new Date().toISOString().split('T')[0];
  a.href=url;
  a.download=`OdontoApp_backup_${fecha}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function prepararEmailBackup(){

Clínica: ${logoInfo.clinicaNombre}
Profesional: ${logoInfo.profesional}
RUC: ${logoInfo.ruc||'—'}

PACIENTES: ${patients.length} registrados
TRATAMIENTOS PENDIENTES: ${pendTx}
INGRESOS TOTALES: $${totalIngresos}
EGRESOS TOTALES: $${totalEgresosNum}
UTILIDAD: $${totalIngresos-totalEgresosNum}
FACTURAS EMITIDAS: ${facturas.length}

Exportado desde OdontoApp el ${fecha}`;

function abrirCorreoBackup(){
  const email=v('f_email_backup');
  const clinicaNombre=document.getElementById('logoText').textContent;
  const fecha=new Date().toISOString().split('T')[0];
  const asunto=encodeURIComponent(`Backup OdontoApp — ${clinicaNombre} — ${fecha}`);
  const cuerpo=encodeURIComponent(`Adjunto el archivo de respaldo de OdontoApp correspondiente al ${fecha}.\n\nClinica: ${clinicaNombre}\n\nPor favor conservar este archivo en lugar seguro.\n\n---\nEnviado desde OdontoApp`);
  const mailto=email?`mailto:${email}?subject=${asunto}&body=${cuerpo}`:`mailto:?subject=${asunto}&body=${cuerpo}`;
  window.open(mailto);
  exportarDatos();
}

function importarDatos(){
  const input=document.createElement('input');
  input.type='file';input.accept='.json';
  input.onchange=function(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=function(ev){
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.patients)throw new Error('Formato inválido');
        if(!confirm(`¿Importar backup del ${data.fechaExportacion?.split('T')[0]||'—'}?\n\nEsto reemplazará los datos actuales con ${data.totalPacientes} pacientes.\n\nEsta acción no se puede deshacer.`))return;
        patients=data.patients;
        egresos=data.egresos||[];
        facturas=data.facturas||[];
        nextId=data.nextId||patients.length+1;
        nextEgId=data.nextEgId||egresos.length+1;
        nextFactId=data.nextFactId||facturas.length+1;
        nextRecetaId=data.nextRecetaId||1;
        // Fix missing arrays
        patients.forEach(pt=>{
          ['surfData','wholeData'].forEach(k=>{if(!pt[k])pt[k]={};});
          ['treatments','payments','appointments','diary','images','consents','recetas'].forEach(k=>{if(!pt[k])pt[k]=[];});
        });
        // Restore logo if present
        if(data.clinica){
          document.getElementById('logoText').textContent=data.clinica.clinicaNombre||'OdontoApp';
          document.getElementById('logoProfesional').textContent=data.clinica.profesional||'Dr. Profesional';
          clinicaRUC=data.clinica.ruc||'';
          clinicaDireccion=data.clinica.direccion||'';
          clinicaTelefono=data.clinica.telefono||'';
        }
        save();closeModal();curPt=null;renderSidebar();showPage('dashboard');
        alert(`✓ Importación exitosa.\n${patients.length} pacientes restaurados.`);
      }catch(err){alert('Error al importar: '+err.message);}
    };
    reader.readAsText(file);
  };
  input.click();
}
