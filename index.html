function sbLoadConfig(){
  const cfg = localStorage.getItem('oa3_sb');
  if(cfg){ const c=JSON.parse(cfg); sbUrl=c.url||''; sbKey=c.key||''; sbClinicaId=c.clinicaId||''; }
}

function sbSaveConfig(){
  localStorage.setItem('oa3_sb', JSON.stringify({url:sbUrl, key:sbKey, clinicaId:sbClinicaId}));
}

function updateSbBtn(text, color){
  const btn=document.getElementById('sbBtn');
  const txt=document.getElementById('sbBtnText');
  if(txt) txt.textContent=text;
  if(btn&&color){ btn.style.borderColor=color; btn.style.color=color; }
}

function sbInit(){
  if(!sbUrl||!sbKey) return false;
  try {
    sbClient = supabase.createClient(sbUrl, sbKey);
    return true;
  } catch(e){ return false; }
}

function sbAction(){
  if(!sbUrl||!sbKey){ openSbSetup(); return; }
  if(!sbClient){ sbInit(); }
  openSbPanel();
}

function openSbSetup(){
  openModal(`<div class="modal-title">☁️ Configurar Supabase</div>
  <div style="background:#e8f0fe;border:1px solid #93c5fd;border-radius:10px;padding:14px;margin-bottom:14px">
    <div style="font-size:13px;font-weight:700;color:#1e40af;margin-bottom:8px">Configuración inicial — 5 minutos, 100% gratis</div>
    <div style="font-size:12px;color:#1e3a8a;line-height:1.9">
      <b>1.</b> Ve a <a href="https://supabase.com" target="_blank" style="color:#1a6cf6;font-weight:600">supabase.com</a> → Crea cuenta gratuita con Google<br>
      <b>2.</b> Clic en <b>"New Project"</b> → nómbralo <b>odontoapp</b> → elige región más cercana<br>
      <b>3.</b> Espera ~2 min mientras crea el proyecto<br>
      <b>4.</b> Ve a <b>Settings → API</b><br>
      <b>5.</b> Copia la <b>Project URL</b> (https://xxx.supabase.co)<br>
      <b>6.</b> Copia el <b>anon public key</b> (empieza con eyJ...)<br>
      <b>7.</b> Ve a <b>SQL Editor</b> y ejecuta este comando:<br>
      <div style="background:#fff;border-radius:6px;padding:8px;margin:6px 0;font-family:monospace;font-size:10px;color:#0f172a;word-break:break-all">
        CREATE TABLE IF NOT EXISTS clinica_data (<br>
        &nbsp;&nbsp;id TEXT PRIMARY KEY,<br>
        &nbsp;&nbsp;data JSONB NOT NULL,<br>
        &nbsp;&nbsp;updated_at TIMESTAMPTZ DEFAULT NOW()<br>
        );<br>
        ALTER TABLE clinica_data ENABLE ROW LEVEL SECURITY;<br>
        CREATE POLICY "public_access" ON clinica_data FOR ALL USING (true) WITH CHECK (true);
      </div>
      <b>8.</b> Pega la URL y la Key abajo y haz clic en Conectar
    </div>
  </div>
  <div class="form-row form-full"><div class="form-group">
    <label>Project URL *</label>
    <input id="f_sburl" value="${sbUrl}" placeholder="https://abcdefgh.supabase.co" style="font-size:12px;font-family:monospace">
  </div></div>
  <div class="form-row form-full"><div class="form-group">
    <label>Anon Public Key *</label>
    <input id="f_sbkey" value="${sbKey}" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." style="font-size:11px;font-family:monospace">
  </div></div>
  <div class="form-row form-full"><div class="form-group">
    <label>ID de tu clínica (crea uno único, sin espacios)</label>
    <input id="f_sbcid" value="${sbClinicaId}" placeholder="dr-garcia-quito" style="font-size:13px">
    <div style="font-size:10px;color:var(--text3);margin-top:3px">Este ID identifica tu clínica en la base de datos. Usa solo letras, números y guiones.</div>
  </div></div>
  <div style="background:#f0fdf4;border:1px solid #86efac;border-radius:10px;padding:12px;margin-bottom:14px">
    <div style="font-size:11px;font-weight:600;color:#15803d;margin-bottom:3px">🔒 Seguridad</div>
    <div style="font-size:11px;color:#166534">Tus datos se guardan en tu propia base de datos Supabase — nadie más tiene acceso. El plan gratuito incluye 500MB de almacenamiento y hasta 50.000 filas.</div>
  </div>
  <div class="modal-footer">
    <button class="btn-sec" onclick="closeModal()">Cancelar</button>
    <button class="btn-primary" onclick="sbConectar()">Conectar y probar</button>
  </div>`);
  document.querySelector('.modal').style.width='580px';
}

async function sbConectar(){
  const url=v('f_sburl').trim();
  const key=v('f_sbkey').trim();
  const cid=v('f_sbcid').trim().toLowerCase().replace(/\s+/g,'-');
  if(!url||!key||!cid){ alert('Completa todos los campos'); return; }
  if(!url.includes('supabase.co')){ alert('La URL debe ser del formato https://xxx.supabase.co'); return; }
  sbUrl=url; sbKey=key; sbClinicaId=cid;
  try {
    sbClient = supabase.createClient(sbUrl, sbKey);
    // Test connection
    const {error} = await sbClient.from('clinica_data').select('id').eq('id', sbClinicaId).limit(1);
    if(error && error.code !== 'PGRST116') throw error;
    sbSaveConfig();
    updateSbBtn('✓ Supabase conectado', '#3ecf8e');
    closeModal();
    openSbPanel();
  } catch(e){
    alert('Error de conexión: ' + (e.message||JSON.stringify(e)) + '\n\nVerifica la URL, la Key y que hayas ejecutado el SQL correctamente.');
    sbClient=null;
  }
}

function openSbPanel(){
  const lastSync = localStorage.getItem('oa3_sb_lastsync');
  openModal(`<div class="modal-title">☁️ Supabase — Sincronización en la nube</div>
  <div style="background:#f0fdf4;border:1px solid #86efac;border-radius:10px;padding:14px;margin-bottom:14px;display:flex;align-items:center;gap:12px">
    <div style="font-size:28px">✅</div>
    <div>
      <div style="font-size:13px;font-weight:700;color:#15803d">Conectado a Supabase</div>
      <div style="font-size:11px;color:#166534;margin-top:2px">Clínica ID: <b>${sbClinicaId}</b></div>
      ${lastSync?`<div style="font-size:10px;color:#166534;margin-top:2px">Última sincronización: ${new Date(lastSync).toLocaleString('es-EC')}</div>`:''}
    </div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
    <div onclick="sbSaveNow(true)" style="background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:border-color .15s" onmouseover="this.style.borderColor='#3ecf8e'" onmouseout="this.style.borderColor='var(--border)'">
      <div style="font-size:28px;margin-bottom:8px">⬆️</div>
      <div style="font-size:13px;font-weight:600;color:var(--text)">Guardar en nube</div>
      <div style="font-size:11px;color:var(--text3);margin-top:4px">Sube todos los datos actuales a Supabase</div>
    </div>
    <div onclick="sbLoadNow()" style="background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:border-color .15s" onmouseover="this.style.borderColor='#3ecf8e'" onmouseout="this.style.borderColor='var(--border)'">
      <div style="font-size:28px;margin-bottom:8px">⬇️</div>
      <div style="font-size:13px;font-weight:600;color:var(--text)">Cargar desde nube</div>
      <div style="font-size:11px;color:var(--text3);margin-top:4px">Descarga la última versión guardada</div>
    </div>
  </div>
  <div style="background:#fef3c7;border:1px solid #fcd34d;border-radius:10px;padding:12px;margin-bottom:14px;font-size:11px;color:#92400e">
    <b>🔄 Auto-sync activado:</b> Cada cambio que hagas se sincroniza automáticamente a la nube en 5 segundos. Para usar en otro dispositivo, abre la app, conéctate con el mismo ID y haz "Cargar desde nube".
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center">
    <button onclick="sbDesconectar()" style="font-size:11px;color:var(--red);background:none;border:none;cursor:pointer">Desconectar</button>
    <button onclick="openSbSetup()" style="font-size:11px;color:var(--text2);background:none;border:none;cursor:pointer">Cambiar configuración</button>
    <button class="btn-sec" onclick="closeModal()">Cerrar</button>
  </div>
  <div id="sb-status" style="margin-top:10px;font-size:12px;text-align:center;min-height:20px"></div>`);
}

function buildPayload(){
  return {
    id: sbClinicaId,
    data: {
      version:'OdontoApp_v3',
      guardado: new Date().toISOString(),
      clinica:{
        nombre:document.getElementById('logoText').textContent,
        profesional:document.getElementById('logoProfesional').textContent,
        ruc:clinicaRUC, direccion:clinicaDireccion, telefono:clinicaTelefono,
        logoColor, logoImg
      },
      patients, egresos, facturas,
      nextId, nextEgId, nextFactId, nextRecetaId,
      meds: MEDICAMENTOS_COMUNES
    },
    updated_at: new Date().toISOString()
  };
}

async function sbSaveNow(manual=false){
  if(!sbClient||!sbClinicaId) return;
  if(sbSyncing) return;
  sbSyncing=true;
  const status=document.getElementById('sb-status');
  if(status){ status.style.color='var(--text2)'; status.textContent='⏳ Sincronizando...'; }
  try {
    const payload = buildPayload();
    const {error} = await sbClient.from('clinica_data').upsert(payload);
    if(error) throw error;
    localStorage.setItem('oa3_sb_lastsync', new Date().toISOString());
    updateSbBtn('✓ Sincronizado', '#3ecf8e');
    if(status){ status.style.color='#10b981'; status.textContent='✓ Guardado en la nube — '+new Date().toLocaleTimeString('es-EC'); }
    if(manual) setTimeout(()=>{ if(status) status.textContent=''; },3000);
  } catch(e){
    if(status){ status.style.color='#ef4444'; status.textContent='✗ Error: '+e.message; }
    updateSbBtn('Error sync — clic para reintentar','#ef4444');
  } finally { sbSyncing=false; }
}

async function sbLoadNow(){
  if(!sbClient||!sbClinicaId) return;
  const status=document.getElementById('sb-status');
  if(status){ status.style.color='var(--text2)'; status.textContent='⏳ Cargando desde Supabase...'; }
  try {
    const {data, error} = await sbClient.from('clinica_data').select('data,updated_at').eq('id',sbClinicaId).single();
    if(error) throw error;
    if(!data||!data.data) throw new Error('No se encontraron datos en la nube');
    const d = data.data;
    closeModal();
    if(!confirm(`¿Cargar datos del ${new Date(data.updated_at).toLocaleString('es-EC')}?\n\n${d.patients?.length||0} pacientes, ${d.facturas?.length||0} facturas.\n\n⚠️ Los datos locales no sincronizados se reemplazarán.`)) return;
    // Restore
    patients=d.patients||[]; egresos=d.egresos||[]; facturas=d.facturas||[];
    nextId=d.nextId||patients.length+1; nextEgId=d.nextEgId||egresos.length+1;
    nextFactId=d.nextFactId||facturas.length+1; nextRecetaId=d.nextRecetaId||1;
    if(d.meds?.length){ MEDICAMENTOS_COMUNES=d.meds; saveMeds(); }
    patients.forEach(pt=>{
      ['surfData','wholeData'].forEach(k=>{if(!pt[k])pt[k]={};});
      ['treatments','payments','appointments','diary','images','consents','recetas'].forEach(k=>{if(!pt[k])pt[k]=[];});
    });
    if(d.clinica){
      document.getElementById('logoText').textContent=d.clinica.nombre||'OdontoApp';
      document.getElementById('logoProfesional').textContent=d.clinica.profesional||'Dr. Profesional';
      clinicaRUC=d.clinica.ruc||''; clinicaDireccion=d.clinica.direccion||''; clinicaTelefono=d.clinica.telefono||'';
      logoColor=d.clinica.logoColor||'#0ea5e9';
      if(d.clinica.logoImg){logoImg=d.clinica.logoImg; applyLogoImg(logoImg);}
      applyColor(logoColor);
    }
    save();
    localStorage.setItem('oa3_sb_lastsync', new Date().toISOString());
    curPt=null; renderSidebar(); showPage('dashboard');
    updateSbBtn('✓ Supabase conectado','#3ecf8e');
    alert('✓ Datos cargados correctamente desde la nube.');
  } catch(e){
    if(status){ status.style.color='#ef4444'; status.textContent='✗ Error: '+e.message; }
  }
}

function sbDesconectar(){
  if(!confirm('¿Desconectar Supabase? Los datos locales no se borrarán.')) return;
  sbClient=null; sbUrl=''; sbKey=''; sbClinicaId='';
  sbSaveConfig();
  const btn=document.getElementById('sbBtn');
  if(btn){btn.style.borderColor='rgba(255,255,255,.1)';btn.style.color='#94a3b8';}
  updateSbBtn('Conectar Supabase',null);
  closeModal();
}

// Auto-sync debounced
function sbAutoSync(){
  if(!sbClient||!sbClinicaId) return;
  clearTimeout(sbSaveTimer);
  sbSaveTimer=setTimeout(()=>sbSaveNow(false).catch(()=>{}), 5000);
}

// ═══ INIT ═══
load();
loadMeds();
loadQuickAppts();
sbLoadConfig();
if(sbUrl&&sbKey){ sbInit(); updateSbBtn('✓ Supabase conectado','#3ecf8e'); }
renderSidebar();
showPage('dashboard');
</script>
